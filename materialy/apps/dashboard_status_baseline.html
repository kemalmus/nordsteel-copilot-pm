<!--
  APLIKACJA:  Dashboard statusu projektu (RAG, milestone'y, RAID, ryzyka, decyzje, działania)
  WERSJA:     baseline (czysty HTML5, jeden plik, bez internetu, bez dodatkowych bibliotek)
  PROJEKT:    Baza wiedzy Nordsteel  - stan na 10 listopada 2026

  JAK ZAPISAĆ:
    Kliknij przycisk "Zapisz projekt". Przeglądarka pobierze NOWĄ KOPIĘ tego pliku z Twoimi
    aktualnymi zmianami (folder Pobrane). Zastąp nią poprzedni plik - to jest Twoja "wersja główna".
    Sama zmiana w oknie przeglądarki NIE zapisuje się po odświeżeniu strony - zawsze klikaj Zapisz.

  JAK ZAKTUALIZOWAĆ PRZEZ COPILOTA:
    1. Otwórz ten plik w Notatniku i skopiuj zawartość bloku <script type="application/json" id="dane">...</script>
       (to są wszystkie dane projektu).
    2. Wklej ją do Copilot Chat razem z nowymi informacjami (maile, notatka ze spotkania) i poproś:
       "Zaktualizuj te dane o poniższe informacje i oddaj TYLKO nowy blok danych w tej samej strukturze."
    3. Podmień w pliku starą zawartość bloku na nową, zapisz plik i otwórz go ponownie.
    4. Sprawdź wynik: co Copilot zmienił, a czego nie ruszył? Decyzje należą do Ciebie.
  Kod: prosty, bez frameworków - Copilot potrafi go odtworzyć z promptu z biblioteki promptów.
-->
<title>Dashboard statusu projektu</title>
<style>
:root{--ok:#1a7f37;--warn:#b7791f;--bad:#c62828;--info:#0b5cad;--bg:#f3f5f8;--card:#ffffff;--ink:#111827;--mut:#4b5563;--line:#c9d1dc;--acc:#0b2f52;--ok-bg:#e3f4e8;--warn-bg:#fbf0d9;--bad-bg:#fbe4e4;--grey:#6b7280}
*{box-sizing:border-box}
html{font-size:17px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.4}
.wrap{max-width:1400px;margin:0 auto;padding:16px}

.mut{color:var(--mut)}
button,select,input{font:inherit;color:inherit}
.btn{background:var(--acc);color:#fff;border:2px solid var(--acc);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn:hover{filter:brightness(1.15)}
.btn.sec{background:#fff;color:var(--acc)}
.btn.sm{padding:3px 9px;font-size:.9rem}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.card{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.s12{grid-column:span 12}.s8{grid-column:span 8}.s7{grid-column:span 7}.s5{grid-column:span 5}.s4{grid-column:span 4}
@media(max-width:1000px){.s8,.s7,.s5,.s4{grid-column:span 12}}
[contenteditable]{outline:none;border-radius:4px;padding:1px 4px;overflow-wrap:anywhere;min-width:1.2em;display:inline-block;max-width:100%}
[contenteditable]:hover{background:#e8effa}
[contenteditable]:focus{background:#fff;box-shadow:0 0 0 3px var(--info)}
[contenteditable]:empty::before{content:attr(data-ph);color:var(--bad);font-style:italic}
.chip{display:inline-block;min-width:2.2em;text-align:center;border-radius:999px;padding:1px 10px;font-weight:700;color:#fff;background:var(--grey);white-space:nowrap}
.c-ok{background:var(--ok)}.c-warn{background:var(--warn)}.c-bad{background:var(--bad)}.c-info{background:var(--info)}.c-grey{background:var(--grey)}
.t-ok{color:var(--ok)}.t-warn{color:var(--warn)}.t-bad{color:var(--bad)}
select{border:2px solid var(--line);border-radius:6px;padding:3px 6px;background:#fff;max-width:100%}
dialog{border:3px solid var(--acc);border-radius:14px;padding:0;width:min(720px,94vw);max-height:90vh;color:var(--ink)}
dialog::backdrop{background:rgba(10,20,35,.6)}
.dlg-in{padding:18px}
.dlg-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:10px}
.dl{display:grid;grid-template-columns:9rem minmax(0,1fr);gap:8px 12px;align-items:start}
.dl dt{font-weight:700;color:var(--mut)}.dl dd{margin:0;min-width:0}
.hint{font-size:.95rem;color:var(--mut)}
.blok{white-space:pre-wrap}
@media print{
 @page{size:A4 landscape;margin:8mm}
 html{font-size:10pt}
 body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .noprint,.btn,.del{display:none!important}
 .wrap{padding:0;max-width:none}
 .card{break-inside:avoid;padding:6px;border-width:1px}
 [contenteditable]:hover{background:none}
 dialog{display:none!important}
}

.hd{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center}
@media(max-width:800px){.hd{grid-template-columns:minmax(0,1fr)}}
.ragbox{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.rag{font-size:1.6rem;font-weight:800;color:#fff;border-radius:12px;padding:8px 18px;letter-spacing:.04em}
.rag.ok{background:var(--ok)}.rag.warn{background:var(--warn)}.rag.bad{background:var(--bad)}
.hdcard{border-width:3px}
.hdcard.ok{border-color:var(--ok)}.hdcard.warn{border-color:var(--warn)}.hdcard.bad{border-color:var(--bad)}
.hdnote{margin-top:8px;font-size:1.05rem}
progress,meter{width:100%;height:22px}
progress{accent-color:var(--info)}
.kpi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kpi div{border:2px solid var(--line);border-radius:10px;text-align:center;padding:6px 2px}
.kpi b{display:block;font-size:2rem;line-height:1.1}
.kpi span.l{font-size:.9rem;color:var(--mut)}
.lab{display:flex;justify-content:space-between;gap:8px;font-weight:600;margin:10px 0 3px}
details>summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"\25BE";font-size:1.3rem;color:var(--mut)}
details[open]>summary::after{content:"\25B4"}
details>.in{margin-top:10px}
.tl{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;position:relative}
.tl li{position:relative;border:2px solid var(--line);border-radius:10px;padding:8px 6px 6px;text-align:center;background:#fff;min-width:0}
.tl li::before{content:"";position:absolute;top:-2px;left:0;right:0;height:8px;border-radius:8px 8px 0 0;background:var(--grey)}
.tl li.ok::before{background:var(--ok)}.tl li.warn::before{background:var(--warn)}.tl li.bad::before{background:var(--bad)}.tl li.info::before{background:var(--info)}

.tl select{font-size:.85rem;margin-top:4px;width:100%}

</head>

var MIES=['stycznia','lutego','marca','kwietnia','maja','czerwca','lipca','sierpnia','września','października','listopada','grudnia'];
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function parseD(s){s=String(s||'').trim().toLowerCase();var m=s.match(/(\d{1,2})\.(\d{1,2})\.(\d{4})/);if(m)return new Date(+m[3],+m[2]-1,+m[1]);m=s.match(/(\d{1,2})\s+([^\s\d]+)\s+(\d{4})/);if(m){var k=MIES.indexOf(m[2]);if(k>=0)return new Date(+m[3],k,+m[1]);}return null}
function ed(l,i,k,txt,ph,extra){return '<span contenteditable="true" spellcheck="false" data-l="'+l+'" data-i="'+i+'" data-k="'+k+'" data-ph="'+esc(ph||'uzupełnij')+'"'+(extra||'')+'>'+esc(txt)+'</span>'}
function sel(l,i,k,val,opts,after){return '<select data-l="'+l+'" data-i="'+i+'" data-k="'+k+'"'+(after?' data-after="'+after+'"':'')+' aria-label="'+k+'">'+opts.map(function(o){return '<option'+(o===val?' selected':'')+'>'+esc(o)+'</option>'}).join('')+'</select>'}
function target(el){var t=DATA[el.dataset.l];return Array.isArray(t)?t[+el.dataset.i]:t}
document.addEventListener('input',function(e){var el=e.target;if(!el.dataset||!el.dataset.l||!el.dataset.k)return;var o=target(el);if(!o)return;
 var v=el.isContentEditable?el.textContent:el.value;if(el.dataset.num!==undefined)v=Number(String(v).replace(/[^\d]/g,'')||0);
 o[el.dataset.k]=v;if(el.dataset.live&&window[el.dataset.live])window[el.dataset.live]();
 if(el.tagName==='SELECT'&&el.dataset.after&&window[el.dataset.after])window[el.dataset.after]()});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.isContentEditable&&!e.target.hasAttribute('data-multi')){e.preventDefault();e.target.blur()}});
document.addEventListener('paste',function(e){if(e.target.isContentEditable){e.preventDefault();var t=(e.clipboardData||window.clipboardData).getData('text');document.execCommand('insertText',false,t.replace(/\s*\n\s*/g,' '))}});
function zapisz(){
 if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
 var cl=document.documentElement.cloneNode(true);
 $$('[data-render]',cl).forEach(function(e){e.innerHTML=''});
 $$('dialog',cl).forEach(function(d){d.removeAttribute('open')});
 $$('details',cl).forEach(function(d){if(d.hasAttribute('data-open'))d.setAttribute('open','')});
 $('#dane',cl).textContent='\n'+JSON.stringify(DATA,null,1).replace(/</g,'\\u003c')+'\n';
 var html='<!DOCTYPE html>\n'+cl.outerHTML;
 var d=new Date(),p=function(n){return ('0'+n).slice(-2)};
 var nazwa=(DATA.plik||'projekt')+'_zapis_'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes())+'.html';
 var blob=new Blob([html],{type:'text/html;charset=utf-8'});
 var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nazwa;document.body.appendChild(a);a.click();
 setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);
 var s=$('#zapisInfo');if(s){s.textContent='Zapisano jako '+nazwa+' (folder Pobrane). Podmień nią poprzedni plik.';}
}
function drukuj(){window.print()}
window.addEventListener('beforeprint',function(){$$('details').forEach(function(d){if(!d.open){d.setAttribute('data-was','1');d.open=true}})});
window.addEventListener('afterprint',function(){$$('details[data-was]').forEach(function(d){d.open=false;d.removeAttribute('data-was')})});
var dlg=null;
function otworz(html){dlg=$('#dlg');$('#dlgBody').innerHTML=html;if(!dlg.open)dlg.showModal()}
function zamknij(){if(dlg&&dlg.open)dlg.close()}
document.addEventListener('DOMContentLoaded',function(){var d=$('#dlg');if(d){d.addEventListener('click',function(e){if(e.target===d)d.close()});}});


var RAGL={ok:'ZIELONY',warn:'ŻÓŁTY',bad:'CZERWONY'};
var MSC={'Zakończony':'ok','W toku':'info','Zagrożony':'bad','Planowany':'grey'};
var ASC={'Zrobione':'ok','W toku':'info','Do zrobienia':'grey'};
function score(r){return r.p*r.i}
function scl(n){return n>=12?'bad':n>=6?'warn':'ok'}
function sortedRisks(){return DATA.risks.map(function(r,i){return {r:r,i:i}}).sort(function(a,b){return score(b.r)-score(a.r)||a.i-b.i})}
function rHd(){var m=DATA.meta,h={ok:90,warn:55,bad:25}[m.rag];
 $('#hdCard').className='card hdcard s12 '+m.rag;
 $('#rHd').innerHTML='<div class="hd"><div><div class="mut">Nordsteel Group · Projekt strategiczny · Sponsor: '+ed('meta',0,'sponsor',m.sponsor)+' · PM: '+ed('meta',0,'pm',m.pm)+'</div>'+
 '<h1>'+ed('meta',0,'projekt',m.projekt)+'</h1>'+
 '<div>Stan na: <b>'+ed('meta',0,'statusNa',m.statusNa)+'</b> · '+ed('meta',0,'tydzien',m.tydzien)+' · Najbliższy Steering Committee: <b>'+ed('meta',0,'steerco',m.steerco)+'</b></div></div>'+
 '<div class="ragbox"><span class="rag '+m.rag+'" aria-label="Status RAG">'+RAGL[m.rag]+'</span><span class="noprint">'+ragSel(m.rag)+'</span></div></div>'+
 '<div class="hdnote"><b>Komentarz PM:</b> '+ed('meta',0,'ragOpis',m.ragOpis,'dodaj komentarz','data-multi')+'</div>'+
 '<div class="lab"><span>Zdrowie projektu (wg statusu RAG)</span><span>'+h+'%</span></div><meter min="0" max="100" low="40" high="70" optimum="100" value="'+h+'"></meter>';
}
function rHdSel(){rHd()}
function ragSel(v){return '<select data-l="meta" data-i="0" data-k="rag" data-after="rHdSel" aria-label="Zmień status RAG">'+['ok','warn','bad'].map(function(o){return '<option value="'+o+'"'+(o===v?' selected':'')+'>'+RAGL[o]+'</option>'}).join('')+'</select>'}
function rTl(){$('#rTl').innerHTML=DATA.milestones.map(function(m,i){var c=MSC[m.status]||'grey';
 return '<li class="'+c+'"><div class="id">'+esc(m.id)+'</div><div class="nm">'+ed('milestones',i,'nazwa',m.nazwa)+'</div><div class="dt">'+ed('milestones',i,'data',m.data)+'</div><span class="noprint">'+sel('milestones',i,'status',m.status,['Zakończony','W toku','Zagrożony','Planowany'],'rTl')+'</span><div class="onlyprint hint">'+esc(m.status)+'</div></li>'}).join('')}
function liveProg(){var p=$('#progOv');if(p)p.value=DATA.meta.postep;var t=$('#progTxt');if(t)t.textContent=DATA.meta.postep+'%'}
function rKpi(){var R=DATA.risks.length,C=DATA.raid,a=DATA.actions,done=a.filter(function(x){return x.status==='Zrobione'}).length,pa=a.length?Math.round(100*done/a.length):0;
 var avg=DATA.risks.length?DATA.risks.reduce(function(s,r){return s+score(r)},0)/DATA.risks.length:0,ex=Math.round(avg/25*100);
 $('#rKpi').innerHTML='<div class="kpi"><div><b>'+R+'</b><span class="l">Ryzyka</span></div><div><b>'+ed('raid',0,'A',C.A,'0',' data-num')+'</b><span class="l">Założenia</span></div><div><b>'+ed('raid',0,'I',C.I,'0',' data-num')+'</b><span class="l">Problemy</span></div><div><b>'+ed('raid',0,'D',C.D,'0',' data-num')+'</b><span class="l">Zależności</span></div></div>'+
 '<div class="lab"><span>Postęp ogólny</span><b id="progTxt">'+DATA.meta.postep+'%</b></div><progress id="progOv" max="100" value="'+DATA.meta.postep+'"></progress><div class="hint noprint">Zmień: '+ed('meta',0,'postep',DATA.meta.postep,'0',' data-num data-live="liveProg"')+' %</div>'+
 '<div class="lab"><span>Ekspozycja na ryzyka (średnia ocena / 25)</span><b>'+ex+'%</b></div><meter min="0" max="100" low="25" high="50" optimum="0" value="'+ex+'"></meter>'+
 '<div class="lab"><span>Działania zakończone</span><b>'+done+' z '+a.length+'</b></div><progress max="100" value="'+pa+'"></progress>'}
function rTop(){$('#rTop').innerHTML=sortedRisks().slice(0,5).map(function(x){var r=x.r,s=score(r);
 return '<button type="button" class="rk" data-ryz="'+x.i+'"><span class="n">'+esc(r.id)+'</span><span>'+esc(r.nazwa)+'<small>P'+r.p+' x W'+r.i+' · '+esc(r.owner)+' · '+esc(r.status)+'</small></span><span class="chip c-'+scl(s)+'">'+s+'</span></button>'}).join('')}
function rDec(){var o=DATA.decisions.map(function(d,i){return {d:d,i:i}}).filter(function(x){return x.d.status!=='Zamknięta'});
 $('#rDec').innerHTML=o.map(function(x){return '<button type="button" class="dc" data-dec="'+x.i+'"><b>'+esc(x.d.id)+'</b> '+esc(x.d.nazwa)+'<small>Decyduje: '+esc(x.d.decydent)+' · do '+esc(x.d.termin)+'</small></button>'}).join('')||'<div class="hint">Brak otwartych decyzji.</div>'}
function rAct(){var now=parseD(DATA.meta.statusNa);
 $('#rAct').innerHTML='<div class="arow h"><span>ID</span><span>Działanie</span><span>Owner</span><span>Termin</span><span>Status</span><span></span></div>'+DATA.actions.map(function(a,i){var d=parseD(a.termin),late=now&&d&&d<now&&a.status!=='Zrobione';
 return '<div class="arow'+(late?' late':'')+'"><b>'+esc(a.id)+'</b><span>'+ed('actions',i,'opis',a.opis,'opis działania')+'</span><span>'+ed('actions',i,'owner',a.owner,'brak ownera!')+'</span><span>'+ed('actions',i,'termin',a.termin,'termin?')+(late?' <span class="tag-late">po terminie</span>':'')+'</span><span>'+sel('actions',i,'status',a.status,['Do zrobienia','W toku','Zrobione'],'actChg')+'</span><button class="del noprint" type="button" data-del="'+i+'" title="Usuń wiersz" aria-label="Usuń">✕</button></div>'}).join('')}
function actChg(){rKpi();rAct()}
function dlgRisk(i){var r=DATA.risks[i],s=score(r);
 otworz('<div class="dlg-top"><h2>'+esc(r.id)+' · '+ed('risks',i,'nazwa',r.nazwa)+'</h2><button class="btn sec sm" type="button" data-zamknij>Zamknij ✕</button></div><dl class="dl">'+
 '<dt>Ocena</dt><dd><span class="chip c-'+scl(s)+'" id="rkScore">'+s+'</span></dd>'+
 '<dt>Prawdopodobieństwo</dt><dd>'+sel('risks',i,'p',String(r.p),['1','2','3','4','5'],'rkNum')+' (1-5)</dd>'+
 '<dt>Wpływ</dt><dd>'+sel('risks',i,'i',String(r.i),['1','2','3','4','5'],'rkNum')+' (1-5)</dd>'+
 '<dt>Właściciel</dt><dd>'+ed('risks',i,'owner',r.owner,'brak ownera!')+'</dd>'+
 '<dt>Status</dt><dd>'+sel('risks',i,'status',r.status,['Otwarte','Zmaterializowane','Zamknięte'])+'</dd>'+
 '<dt>Opis</dt><dd>'+ed('risks',i,'opis',r.opis,'opis','data-multi')+'</dd>'+
 '<dt>Mitigation</dt><dd>'+ed('risks',i,'mitigation',r.mitigation,'brak planu działań!','data-multi')+'</dd></dl>');
 dlgKind={l:'risks',i:i}}
var dlgKind=null;
function rkNum(){var r=DATA.risks[dlgKind.i];r.p=+r.p;r.i=+r.i;var s=score(r),c=$('#rkScore');c.textContent=s;c.className='chip c-'+scl(s)}
function dlgDec(i){var d=DATA.decisions[i];
 otworz('<div class="dlg-top"><h2>'+esc(d.id)+' · Decyzja</h2><button class="btn sec sm" type="button" data-zamknij>Zamknij ✕</button></div><dl class="dl">'+
 '<dt>Decyzja</dt><dd>'+ed('decisions',i,'nazwa',d.nazwa,'treść decyzji','data-multi')+'</dd>'+
 '<dt>Decyduje</dt><dd>'+ed('decisions',i,'decydent',d.decydent,'brak decydenta!')+'</dd>'+
 '<dt>Termin</dt><dd>'+ed('decisions',i,'termin',d.termin,'termin?')+'</dd>'+
 '<dt>Status</dt><dd>'+sel('decisions',i,'status',d.status,['Otwarta','Zamknięta'])+'</dd>'+
 '<dt>Kontekst</dt><dd>'+ed('decisions',i,'kontekst',d.kontekst,'kontekst','data-multi')+'</dd></dl>');
 dlgKind={l:'decisions',i:i}}
function odswiez(){rTop();rDec();rKpi();rTl()}
function all(){rHd();rTl();rKpi();rTop();rDec();rAct()}
document.addEventListener('click',function(e){var t=e.target.closest('button');if(!t)return;
 if(t.id==='bZapisz')zapisz();else if(t.id==='bDruk')drukuj();
 else if(t.hasAttribute('data-zamknij'))zamknij();
 else if(t.dataset.ryz!==undefined)dlgRisk(+t.dataset.ryz);
 else if(t.dataset.dec!==undefined)dlgDec(+t.dataset.dec);
 else if(t.dataset.del!==undefined){DATA.actions.splice(+t.dataset.del,1);rAct();rKpi()}
 else if(t.id==='bAct'){var n=DATA.actions.length+1;DATA.actions.push({id:'A'+n,opis:'',owner:'',termin:'',status:'Do zrobienia'});rAct();rKpi();var c=$$('#rAct .arow')[DATA.actions.length];if(c)$('[contenteditable]',c).focus()}
 else if(t.id==='bRyz'){var k=DATA.risks.length+1;DATA.risks.push({id:'R'+k,nazwa:'Nowe ryzyko',p:3,i:3,owner:'',status:'Otwarte',opis:'',mitigation:''});odswiez();dlgRisk(DATA.risks.length-1)}
 else if(t.id==='bDec'){var q=DATA.decisions.length+1;DATA.decisions.push({id:'D'+q,nazwa:'',decydent:'',termin:'',status:'Otwarta',kontekst:''});rDec();dlgDec(DATA.decisions.length-1)}});
document.addEventListener('DOMContentLoaded',function(){all();$('#dlg').addEventListener('close',function(){odswiez()})});

</script>
</body>
</html>
